<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocoon Checklist — Console Ultime</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#161922;
    --panel2:#1c202b;
    --border:#2a2f3d;
    --text:#e8eaf0;
    --muted:#8b90a3;
    --accent:#4ade80;
    --accent-dim:#2c6b46;
    --warn:#f59e0b;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:24px 28px 18px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
  }
  h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:0.3px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:16px;
  }
  .stats-bar{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 16px;
    min-width:120px;
  }
  .stat .num{
    font-size:20px;
    font-weight:700;
    color:var(--accent);
  }
  .stat .lbl{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .progress-outer{
    height:6px;
    background:var(--panel2);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .progress-inner{
    height:100%;
    background:linear-gradient(90deg,var(--accent-dim),var(--accent));
    transition:width .3s ease;
  }
  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  input[type=text]{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    flex:1;
    min-width:180px;
  }
  select{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
  }
  button{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.primary{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:#eafff0;
  }
  button.danger:hover{border-color:var(--danger);}
  main{
    padding:20px 28px 60px;
    max-width:1100px;
    margin:0 auto;
  }
  .category{
    margin-bottom:26px;
  }
  .category-title{
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
  }
  .category-count{
    color:var(--accent);
    font-weight:400;
  }
  .platform{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .platform.done{
    border-color:var(--accent-dim);
  }
  .platform-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    cursor:pointer;
  }
  .platform-header:hover{background:var(--panel2);}
  .platform-check{
    width:18px;height:18px;
    flex-shrink:0;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .platform-name{
    font-weight:600;
    font-size:14px;
    flex:1;
  }
  .platform-folder{
    font-family:"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--muted);
    background:var(--panel2);
    padding:2px 8px;
    border-radius:5px;
  }
  .platform-gamecount{
    font-size:12px;
    color:var(--muted);
    min-width:70px;
    text-align:right;
  }
  .chevron{
    color:var(--muted);
    font-size:12px;
    transition:transform .2s;
    width:14px;
  }
  .platform.expanded .chevron{transform:rotate(90deg);}
  .platform-body{
    display:none;
    padding:0 14px 14px;
    border-top:1px solid var(--border);
  }
  .platform.expanded .platform-body{display:block;}
  .game-add{
    display:flex;
    gap:8px;
    margin:12px 0 10px;
  }
  .game-add input{
    padding:7px 10px;
    font-size:13px;
  }
  .game-add button{
    padding:7px 12px;
  }
  .game-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .game-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 8px;
    border-radius:6px;
    background:var(--panel2);
    font-size:13px;
  }
  .game-item.done .game-name{
    text-decoration:line-through;
    color:var(--muted);
  }
  .game-item input[type=checkbox]{
    accent-color:var(--accent);
    cursor:pointer;
  }
  .game-name{flex:1;}
  .game-remove{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    padding:2px 6px;
  }
  .game-remove:hover{color:var(--danger);}
  .empty-games{
    color:var(--muted);
    font-size:12px;
    font-style:italic;
    padding:6px 2px;
  }
  .hidden{display:none !important;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:20px;
  }
  @media (max-width:600px){
    header{padding:16px 16px 14px;}
    main{padding:14px 16px 50px;}
    .platform-folder{display:none;}
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>Cocoon Checklist</h1>
  <div class="subtitle">122 plateformes · Suivi de configuration & bibliothèque de jeux</div>

  <div class="stats-bar">
    <div class="stat">
      <div class="num" id="statPlatformsDone">0/122</div>
      <div class="lbl">Plateformes configurées</div>
    </div>
    <div class="stat">
      <div class="num" id="statGamesTotal">0</div>
      <div class="lbl">Jeux trackés</div>
    </div>
    <div class="stat">
      <div class="num" id="statGamesDone">0</div>
      <div class="lbl">Jeux obtenus</div>
    </div>
  </div>

  <div class="progress-outer"><div class="progress-inner" id="progressBar" style="width:0%"></div></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Rechercher une plateforme ou un jeu...">
    <select id="filterCategory"><option value="all">Toutes les catégories</option></select>
    <select id="filterStatus">
      <option value="all">Tout</option>
      <option value="done">Configurées</option>
      <option value="todo">À configurer</option>
    </select>
    <button id="exportBtn">Exporter JSON</button>
    <button id="resetBtn" class="danger">Réinitialiser</button>
  </div>
</header>

<main id="main"></main>

<footer>Données sauvegardées localement dans ton navigateur (localStorage) — aucun serveur, aucune connexion requise.</footer>

function seededGames(folder){
  const list = DEFAULT_GAMES[folder];
  if(!list) return [];
  return list.map(name => ({ name, done:false }));
}

function loadState(){
  let state = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state) state = {};

  PLATFORM_DATA.forEach(([cat, plats])=>{
    plats.forEach(([name, folder])=>{
      if(!state[folder]){
        // Nouvelle plateforme jamais vue : on la crée et on pré-remplit si une
        // liste par défaut existe pour elle.
        state[folder] = { done:false, games: seededGames(folder), seeded: !!DEFAULT_GAMES[folder] };
      } else if(DEFAULT_GAMES[folder] && !state[folder].seeded){
        // Plateforme déjà présente (créée vide avant l'ajout de sa liste par
        // défaut) mais jamais pré-remplie : on ajoute les jeux par défaut
        // manquants sans toucher à ceux déjà cochés/ajoutés par l'utilisateur.
        const existingNames = new Set(state[folder].games.map(g => g.name));
        DEFAULT_GAMES[folder].forEach(name => {
          if(!existingNames.has(name)) state[folder].games.push({ name, done:false });
        });
        state[folder].seeded = true;
      }
    });
  });

  return state;
}

let state = loadState();

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderStats();
}

function ensurePlatform(folder){
  if(!state[folder]) state[folder] = { done:false, games: seededGames(folder), seeded: !!DEFAULT_GAMES[folder] };
  return state[folder];
}

const mainEl = document.getElementById("main");
const searchEl = document.getElementById("search");
const filterCategoryEl = document.getElementById("filterCategory");
const filterStatusEl = document.getElementById("filterStatus");

PLATFORM_DATA.forEach(([cat]) => {
  const opt = document.createElement("option");
  opt.value = cat;
  opt.textContent = cat;
  filterCategoryEl.appendChild(opt);
});

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const catFilter = filterCategoryEl.value;
  const statusFilter = filterStatusEl.value;
  mainEl.innerHTML = "";

  PLATFORM_DATA.forEach(([cat, plats])=>{
    if(catFilter !== "all" && catFilter !== cat) return;

    const visiblePlats = plats.filter(([name, folder])=>{
      const s = ensurePlatform(folder);
      if(statusFilter === "done" && !s.done) return false;
      if(statusFilter === "todo" && s.done) return false;
      if(!q) return true;
      if(name.toLowerCase().includes(q) || folder.toLowerCase().includes(q)) return true;
      return s.games.some(g => g.name.toLowerCase().includes(q));
    });

    if(visiblePlats.length === 0) return;

    const catDiv = document.createElement("div");
    catDiv.className = "category";

    const doneCount = plats.filter(([n,f]) => ensurePlatform(f).done).length;

    catDiv.innerHTML = `<div class="category-title"><span>${cat}</span><span class="category-count">${doneCount}/${plats.length}</span></div>`;

    visiblePlats.forEach(([name, folder])=>{
      const s = ensurePlatform(folder);
      const pDiv = document.createElement("div");
      pDiv.className = "platform" + (s.done ? " done" : "");
      pDiv.dataset.folder = folder;

      const gameDoneCount = s.games.filter(g=>g.done).length;

      pDiv.innerHTML = `
        <div class="platform-header">
          <span class="chevron">▶</span>
          <input type="checkbox" class="platform-check" ${s.done ? "checked":""}>
          <span class="platform-name">${name}</span>
          <span class="platform-folder">${folder}</span>
          <span class="platform-gamecount">${gameDoneCount}/${s.games.length} jeux</span>
        </div>
        <div class="platform-body">
          <div class="game-add">
            <input type="text" placeholder="Ajouter un jeu..." class="game-input">
            <button class="primary add-game-btn">Ajouter</button>
          </div>
          <div class="game-list"></div>
        </div>
      `;

      const header = pDiv.querySelector(".platform-header");
      const checkbox = pDiv.querySelector(".platform-check");
      const gameList = pDiv.querySelector(".game-list");
      const gameInput = pDiv.querySelector(".game-input");
      const addBtn = pDiv.querySelector(".add-game-btn");

      header.addEventListener("click", (e)=>{
        if(e.target === checkbox) return;
        pDiv.classList.toggle("expanded");
      });

      checkbox.addEventListener("click", (e)=>{
        e.stopPropagation();
        s.done = checkbox.checked;
        pDiv.classList.toggle("done", s.done);
        saveState();
      });

      function renderGames(){
        s.games.sort((a,b)=> a.name.localeCompare(b.name, 'fr', {sensitivity:'base', numeric:true}));
        gameList.innerHTML = "";
        if(s.games.length === 0){
          gameList.innerHTML = `<div class="empty-games">Aucun jeu ajouté pour l'instant.</div>`;
          return;
        }
        s.games.forEach((g, idx)=>{
          const gDiv = document.createElement("div");
          gDiv.className = "game-item" + (g.done ? " done" : "");
          gDiv.innerHTML = `
            <input type="checkbox" ${g.done ? "checked":""}>
            <span class="game-name">${g.name}</span>
            <button class="game-remove">✕</button>
          `;
          gDiv.querySelector("input").addEventListener("change", (e)=>{
            g.done = e.target.checked;
            gDiv.classList.toggle("done", g.done);
            updateGameCountLabel();
            saveState();
          });
          gDiv.querySelector(".game-remove").addEventListener("click", ()=>{
            s.games.splice(idx,1);
            renderGames();
            updateGameCountLabel();
            saveState();
          });
          gameList.appendChild(gDiv);
        });
      }

      function updateGameCountLabel(){
        const dc = s.games.filter(g=>g.done).length;
        pDiv.querySelector(".platform-gamecount").textContent = `${dc}/${s.games.length} jeux`;
      }

      function addGame(){
        const val = gameInput.value.trim();
        if(!val) return;
        s.games.push({ name: val, done:false });
        gameInput.value = "";
        renderGames();
        updateGameCountLabel();
        saveState();
      }

      addBtn.addEventListener("click", addGame);
      gameInput.addEventListener("keydown", (e)=>{
        if(e.key === "Enter") addGame();
      });

      renderGames();
      catDiv.appendChild(pDiv);
    });

    mainEl.appendChild(catDiv);
  });

  if(mainEl.children.length === 0){
    mainEl.innerHTML = `<div class="empty-games" style="text-align:center;padding:40px;">Aucun résultat.</div>`;
  }
}

function renderStats(){
  let platformsDone = 0, platformsTotal = 0, gamesTotal = 0, gamesDone = 0;
  PLATFORM_DATA.forEach(([cat, plats])=>{
    plats.forEach(([name, folder])=>{
      const s = ensurePlatform(folder);
      platformsTotal++;
      if(s.done) platformsDone++;
      gamesTotal += s.games.length;
      gamesDone += s.games.filter(g=>g.done).length;
    });
  });
  document.getElementById("statPlatformsDone").textContent = `${platformsDone}/${platformsTotal}`;
  document.getElementById("statGamesTotal").textContent = gamesTotal;
  document.getElementById("statGamesDone").textContent = gamesDone;
  document.getElementById("progressBar").style.width = (platformsTotal ? (platformsDone/platformsTotal*100) : 0) + "%";
}

searchEl.addEventListener("input", render);
filterCategoryEl.addEventListener("change", render);
filterStatusEl.addEventListener("change", render);

document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cocoon_checklist_export.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Réinitialiser toute la checklist ? Cette action est irréversible.")){
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    render();
    renderStats();
  }
});

render();
renderStats();
</script>
